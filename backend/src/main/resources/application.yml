spring:
  application:
    name: threadhub-backend

  # Database configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:threadhubdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console (available at /h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Security configuration (OAuth2 placeholders)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-secret}
            scope:
              - email
              - profile

# Custom Application Properties
app:
  # The URL of the frontend for OAuth2 redirect. Override in production (e.g. Vercel URL)
  frontend-url: ${VITE_FRONTEND_URL:http://localhost:5173}

# Custom JWT properties
jwt:
  # Secret key (should be at least 256 bits). In production, inject via env variables.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours in ms
